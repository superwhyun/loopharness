description = "Run the project harness workflow using the canonical docs."
prompt = """
Read the project instructions and run the harness workflow.

Start with:
- @{AGENTS.md}
- @{skills/harness/framework/docs/HARNESS.md}
- @{skills/harness/framework/docs/ARCHITECTURE.md}
- @{skills/harness/framework/docs/ADR.md}
- @{docs/PRD.md} (target project's own, if present)

If there is an active phase, inspect the current files under `phases/` and continue from the first pending step.
Target project resolution:
- Use a project path appended by the user when present.
- Otherwise read `.harness/current_project`.
- If neither exists or the value is empty, ask the user for the target project path.
If the user appended extra arguments to this command, treat them as additional instructions.
"""
